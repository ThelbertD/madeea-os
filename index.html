<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MadeEA OS — your AI command centre</title>
<meta name="description" content="MadeEA OS web console — chat with free AI models, run a multi-agent mastermind, and keep your board, tasks and notes. Talks to a local OmniRoute gateway." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#09141f; --surface:#0e1f2f; --surface-2:#15293b; --border:#1c3247;
  --fg:#f4f4f5; --muted:#a3b3c2; --faint:#6b7d8f;
  --accent:#fd5812; --accent-soft:#ff7a42;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 65% 45% at 12% 6%, rgba(253,88,18,.10), transparent 60%),
    radial-gradient(ellipse 55% 40% at 88% 22%, rgba(255,122,66,.06), transparent 60%);
}
a{color:var(--accent-soft);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(253,88,18,.18);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(253,88,18,.32)}

/* ── shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-columns:244px 1fr;height:100vh;position:relative;z-index:2}
aside{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 0;overflow:hidden
}
.brand{padding:0 20px 20px}
.brand .eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:5px}
.brand .word{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand .word em{font-style:italic;color:var(--accent);margin-left:3px}
.brand .build{font-size:10px;color:var(--faint);margin-top:3px;letter-spacing:.06em}
.nav{flex:1;overflow-y:auto;padding:0 12px}
.nav-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:14px 8px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--muted);
  transition:.12s;margin-bottom:1px
}
.nav-item:hover{background:rgba(253,88,18,.06);color:var(--fg)}
.nav-item.active{background:var(--surface-2);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item .ico{width:16px;text-align:center;font-size:13px;opacity:.85}
.nav-item .badge{margin-left:auto;font-size:10px;color:var(--faint)}
.side-foot{padding:14px 20px 0;border-top:1px solid var(--border);margin:0 12px}
.gw{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.dot.off{background:var(--bad)}
.dot.wait{background:var(--warn);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}

main{overflow-y:auto;padding:30px 38px 60px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.eyebrow-row{display:flex;align-items:center;gap:13px;color:var(--faint);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.eyebrow-row .num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--accent);letter-spacing:0}
.eyebrow-row .rule{width:30px;height:1px;background:var(--accent);opacity:.55}
h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:12px 0 6px}
.sub{color:var(--muted);font-size:15px;margin-bottom:6px}
.stamp{font-size:12px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px}
.stamp b{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--accent);font-weight:600;letter-spacing:0;font-size:14px}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 15px;font-size:13.5px;font-weight:500;transition:.12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-soft)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--fg)}
.btn-sm{padding:5px 11px;font-size:12px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:34px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px}
.tile .k{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--faint);font-weight:700;display:flex;align-items:center;gap:6px}
.tile .v{font-size:21px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
.tile .v.acc{color:var(--accent);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px}
.tile .m{font-size:11px;color:var(--faint);margin-top:3px;font-family:'JetBrains Mono',monospace}

.divider{display:flex;align-items:center;gap:16px;margin:34px 0;color:var(--accent);opacity:.5}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:currentColor}

.notice{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--surface);border-radius:10px;padding:15px 17px;margin-bottom:22px;font-size:14px;color:var(--muted)}
.notice strong{color:var(--fg)}
.notice.bad{border-left-color:var(--bad)}
.notice code{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:4px;color:var(--accent-soft)}

.input{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;
  padding:10px 13px;color:var(--fg);font-size:14px;outline:none;transition:.12s
}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--faint)}
select.input{cursor:pointer}
.label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* ── chat ──────────────────────────────────────────── */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:340px}
.chat-log{flex:1;overflow-y:auto;padding:4px 2px 16px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:78%;padding:11px 15px;border-radius:13px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .who{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.75;margin-bottom:5px;display:block}
.msg.err{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08);color:#fecaca}
.chat-form{display:flex;gap:9px;padding-top:14px;border-top:1px solid var(--border)}
.empty{text-align:center;color:var(--faint);padding:56px 20px;font-size:14px}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:3px;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* ── kanban ────────────────────────────────────────── */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:230px}
.col.drag{border-color:var(--accent);background:rgba(253,88,18,.05)}
.col h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:11px;display:flex;justify-content:space-between}
.kcard{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;cursor:grab;display:flex;gap:8px;align-items:flex-start}
.kcard:active{cursor:grabbing}
.kcard .x{margin-left:auto;color:var(--faint);font-size:15px;line-height:1;flex-shrink:0}
.kcard .x:hover{color:var(--bad)}

/* ── list (todos) ──────────────────────────────────── */
.row{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row.done .txt{text-decoration:line-through;color:var(--faint)}
.tick{width:17px;height:17px;border:1.5px solid var(--border);border-radius:5px;flex-shrink:0;transition:.12s}
.tick:hover{border-color:var(--accent)}
.tick.on{background:var(--accent);border-color:var(--accent);position:relative}
.tick.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.txt{flex:1;font-size:14px}
.del{color:var(--faint);font-size:17px;line-height:1}
.del:hover{color:var(--bad)}

/* ── palette ───────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(4,10,16,.75);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh}
.palette{width:min(540px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.palette input{width:100%;padding:15px 18px;background:none;border:none;border-bottom:1px solid var(--border);color:var(--fg);font-size:15px;outline:none}
.palette .list{max-height:330px;overflow-y:auto;padding:6px}
.palette .opt{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--muted);width:100%;text-align:left}
.palette .opt:hover,.palette .opt.sel{background:var(--surface-2);color:var(--fg)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--faint)}

h2{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:700;margin-bottom:5px;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:13px}
.hide{display:none!important}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
pre{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 16px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75}
pre .c{color:var(--faint)}
.mobile-bar{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:244px;z-index:40;transform:translateX(-100%);transition:.2s}
  aside.open{transform:none}
  main{padding:20px 18px 60px}
  .mobile-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .board{grid-template-columns:1fr}
  .msg{max-width:90%}
}
</style>
</head>
<body>

<div class="app">
  <aside id="side">
    <div class="brand">
      <div class="eyebrow">Local · Studio</div>
      <div class="word">MadeEA <em>OS</em></div>
      <div class="build">web console</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="gw"><span class="dot wait" id="gwDot"></span><span id="gwText">checking gateway…</span></div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="scrim hide" id="paletteScrim">
  <div class="palette">
    <input id="paletteInput" placeholder="Jump to…" autocomplete="off" />
    <div class="list" id="paletteList"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   MadeEA OS — web console
   A static page that does everything a browser is physically able
   to do. Chat and models are LIVE against a local OmniRoute
   gateway; board, tasks and notes persist in localStorage.
   Anything needing a server (spawning CLIs, reading your vault)
   cannot run here and says so plainly.
   ═══════════════════════════════════════════════════════════════ */

const LS = 'madeea.os.';
const store = {
  get(k, d){ try { const v = localStorage.getItem(LS+k); return v===null?d:JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(LS+k, JSON.stringify(v)); } catch {} }
};

const state = {
  gateway: store.get('gateway', 'http://localhost:20128'),
  model:   store.get('model', ''),
  models:  [],
  online:  null,
  chat:    store.get('chat', []),
  room:    store.get('room', []),
  todos:   store.get('todos', []),
  board:   store.get('board', { ideas:[], doing:[], done:[] }),
  notes:   store.get('notes', ''),
  view:    (location.hash || '#/').slice(2) || 'mission',
  busy:    false
};

/* The seven Mastermind agents, personas lifted from the real
   src/lib/agentRoom.ts so characters match the desktop app. */
const AGENTS = [
  { id:'claude',  name:'Claude',   color:'#ff8a5b', persona:'You are Claude — thoughtful, careful, balanced. You weigh trade-offs, bring nuance, and give a calm, precise take. You gently flag risks others miss.' },
  { id:'hermes',  name:'Hermes',   color:'#60a5fa', persona:'You are Hermes — direct, action-oriented, a little unfiltered. You cut straight to the practical next step and call out fluff. You like momentum.' },
  { id:'gemini',  name:'Gemini',   color:'#4285F4', persona:'You are Gemini — broad knowledge, curious and upbeat. You bring data, facts, and a research angle to the table.' },
  { id:'codex',   name:'Codex',    color:'#22c55e', persona:'You are Codex — pragmatic, implementation-first. You think in systems and concrete steps, and you sketch the how.' },
  { id:'openclaw',name:'OpenClaw', color:'#f472b6', persona:'You are OpenClaw — open-source, bold, a little cheeky. You challenge assumptions and champion the scrappy, independent path.' },
  { id:'glm',     name:'GLM 5.2',  color:'#34E5B0', persona:'You are GLM 5.2 — the efficient builder. You ship the grinding work others would charge a fortune for, and champion the cheaper, open-weights path.' },
  { id:'fcc',     name:'Free Claude Code', color:'#10b981', persona:'You are Free Claude Code — scrappy and resourceful, running locally for free. You love the clever low-cost solution.' }
];

const ROOM_RULES = 'You are in a fast, live group chat with the user and a few other AI agents. Keep every message SHORT — 1 to 3 sentences, like a real chat. Stay fully in character. No preamble, no name prefix — just your message.';

const NAV = [
  { group:'Workspace' },
  { id:'mission',    label:'Mission Control', ico:'▦' },
  { group:'Agent Orchestration' },
  { id:'chat',       label:'AI Chat',         ico:'✦', live:true },
  { id:'mastermind', label:'AI Agent Mastermind', ico:'❋', live:true },
  { id:'models',     label:'Models',          ico:'⌘', live:true },
  { group:'Self' },
  { id:'kanban',     label:'Kanban',          ico:'▤' },
  { id:'todos',      label:"Today's List",    ico:'✓' },
  { id:'notes',      label:'Notes',           ico:'✎' },
  { group:'System' },
  { id:'settings',   label:'Settings',        ico:'⚙' },
  { id:'about',      label:'About',           ico:'◈' }
];

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── gateway ─────────────────────────────────────────────────── */
async function probeGateway(){
  setGw('wait','checking gateway…');
  try{
    const r = await fetch(state.gateway.replace(/\/+$/,'') + '/v1/models', { signal: AbortSignal.timeout(8000) });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    state.models = (j.data||[]).map(m=>m.id);
    state.online = true;
    if(!state.model || !state.models.includes(state.model)){
      // oc/deepseek-v4-flash-free was the one model reliably answering when
      // this page was written; fall back to whatever the gateway offers.
      state.model = state.models.find(m=>m==='oc/deepseek-v4-flash-free')
                 || state.models.find(m=>m.startsWith('oc/'))
                 || state.models[0] || '';
      store.set('model', state.model);
    }
    setGw('on', state.models.length + ' models live');
  }catch(e){
    state.online = false; state.models = [];
    setGw('off','gateway offline');
  }
  render();
}
function setGw(cls, text){
  const d = $('#gwDot'), t = $('#gwText');
  if(d) d.className = 'dot ' + cls;
  if(t) t.textContent = text;
}

/* Streams a completion. onDelta fires per token. */
async function streamChat(messages, onDelta, signal){
  const base = state.gateway.replace(/\/+$/,'');
  const r = await fetch(base + '/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer free-local' },
    body: JSON.stringify({ model: state.model, messages, stream:true }),
    signal
  });
  if(!r.ok){
    let m = 'HTTP ' + r.status;
    try{ const j = await r.json(); m = j?.error?.message || m; }catch{}
    throw new Error(m);
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let carry = '', full = '';
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    carry += dec.decode(value, { stream:true });
    const lines = carry.split('\n'); carry = lines.pop() ?? '';
    for(const raw of lines){
      const line = raw.trim();
      if(!line.startsWith('data:')) continue;
      const p = line.slice(5).trim();
      if(!p || p === '[DONE]') continue;
      try{
        const d = JSON.parse(p).choices?.[0]?.delta?.content;
        if(d){ full += d; onDelta(d); }
      }catch{ /* chunk split mid-JSON — next read completes it */ }
    }
  }
  return full;
}

/* ── views ───────────────────────────────────────────────────── */
const views = {};

views.mission = () => {
  const done = state.todos.filter(t=>t.done).length;
  const cards = state.board.ideas.length + state.board.doing.length + state.board.done.length;
  return head('I','Mission Control','Status of every agent, every memory, every signal.') + `
  <div class="tiles">
    <div class="tile"><div class="k"><span class="dot ${state.online?'on':state.online===false?'off':'wait'}"></span>Gateway</div>
      <div class="v">${state.online?'Live':state.online===false?'Offline':'…'}</div>
      <div class="m">${esc(state.gateway.replace(/^https?:\/\//,''))}</div></div>
    <div class="tile"><div class="k">Models</div><div class="v acc">${state.models.length||'—'}</div><div class="m">${esc(state.model||'none selected')}</div></div>
    <div class="tile"><div class="k">Agents</div><div class="v acc">${AGENTS.length}</div><div class="m">mastermind roster</div></div>
    <div class="tile"><div class="k">Today's list</div><div class="v">${done}<span style="color:var(--faint);font-size:14px">/${state.todos.length}</span></div><div class="m">tasks complete</div></div>
    <div class="tile"><div class="k">Board</div><div class="v">${cards}</div><div class="m">cards tracked</div></div>
    <div class="tile"><div class="k">Messages</div><div class="v">${state.chat.length + state.room.length}</div><div class="m">stored locally</div></div>
  </div>
  ${state.online === false ? offlineNotice() : ''}
  <div class="divider">✦</div>
  <h2>Jump in</h2>
  <p class="sub" style="margin-bottom:16px">Everything here runs in your browser. Press <span class="kbd">Ctrl</span>+<span class="kbd">K</span> for the command palette.</p>
  <div class="grid2">
    ${quick('chat','✦','AI Chat','Stream replies from free models through your gateway.')}
    ${quick('mastermind','❋','Mastermind','Seven agents, each in character, answering together.')}
    ${quick('kanban','▤','Kanban','Drag cards across Ideas → Doing → Done.')}
    ${quick('todos','✓',"Today's List",'Tick things off. Saved in this browser.')}
  </div>
  <div class="divider">✦</div>
  <h2>The real dashboard</h2>
  <p class="sub" style="margin-bottom:16px">All 42 pages of the actual MadeEA OS interface, exported exactly as they look on your machine. Read-only — the panels are empty because there is no server behind them.</p>
  <a class="btn btn-primary" href="app/">Open the full interface →</a>`;
};
const quick = (id,ico,t,d) => `<button class="card" style="text-align:left" onclick="go('${id}')">
  <div style="color:var(--accent);font-size:17px;margin-bottom:7px">${ico}</div>
  <h3 style="font-size:15px;font-weight:600;margin-bottom:4px">${t}</h3>
  <p style="color:var(--muted);font-size:13.5px">${d}</p></button>`;

const offlineNotice = () => `<div class="notice bad">
  <strong>Gateway offline.</strong> Chat and the Mastermind need OmniRoute running on your machine. Start it with
  <code>npm install -g omniroute &amp;&amp; omniroute</code> then <button class="btn btn-ghost btn-sm" style="margin-left:6px" onclick="probeGateway()">retry</button>
  <br><span style="font-size:13px;color:var(--faint)">Board, tasks and notes work regardless — they're stored in this browser.</span>
</div>`;

views.chat = () => head('II','AI Chat','Streamed straight from your local gateway. Free models, no API key.') + `
  ${state.online===false ? offlineNotice() : ''}

  `<div class="msg ${role==='user'?'user':role==='err'?'bot err':'bot'}">
     <span class="who" ${color?`style="color:${color}"`:''}>${esc(who)}</span>${esc(text)}</div>`;

const head = (num,title,sub) => `
  <div class="mobile-bar"><button class="btn btn-ghost btn-sm" onclick="toggleSide()">☰ Menu</button></div>
  <div class="eyebrow-row"><span class="num">${num}.</span><span class="rule"></span><span>${esc(title)}</span></div>
  <h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
  <p class="stamp"><b>${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</b> · Local · Studio</p>`;

/* ── actions ─────────────────────────────────────────────────── */
function go(v){ state.view = v; location.hash = '#/'+v; $('#side').classList.remove('open'); render(); }
function toggleSide(){ $('#side').classList.toggle('open'); }
function pickModel(m){ state.model = m; store.set('model', m); render(); }
function saveGateway(){ state.gateway = ($('#gwIn').value||'').trim() || 'http://localhost:20128'; store.set('gateway', state.gateway); probeGateway(); }
function resetAll(){ if(confirm('Clear chat, board, tasks and notes stored in this browser?')){ Object.keys(localStorage).filter(k=>k.startsWith(LS)).forEach(k=>localStorage.removeItem(k)); location.reload(); } }
function clearChat(){ state.chat=[]; store.set('chat',[]); render(); }
function clearRoom(){ state.room=[]; store.set('room',[]); render(); }

function addTodo(e){ e.preventDefault(); const i=$('#todoIn'), t=i.value.trim(); if(!t) return; state.todos.push({text:t,done:false}); store.set('todos',state.todos); i.value=''; render(); }
function toggleTodo(i){ state.todos[i].done=!state.todos[i].done; store.set('todos',state.todos); render(); }
function delTodo(i){ state.todos.splice(i,1); store.set('todos',state.todos); render(); }

function addCard(e){ e.preventDefault(); const i=$('#cardIn'), t=i.value.trim(); if(!t) return; state.board.ideas.push(t); store.set('board',state.board); i.value=''; render(); }
function delCard(col,i){ state.board[col].splice(i,1); store.set('board',state.board); render(); }
let drag=null;
function dragCard(e,col,i){ drag={col,i}; e.dataTransfer.effectAllowed='move'; }
function dropCard(e,col){
  e.preventDefault(); e.currentTarget.classList.remove('drag');
  if(!drag || drag.col===col) return;
  const [c] = state.board[drag.col].splice(drag.i,1);
  state.board[col].push(c); store.set('board',state.board); drag=null; render();
}

let noteTimer;
function saveNotes(v){
  state.notes = v; clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{ store.set('notes',v); const s=$('#noteStamp'); if(s) s.textContent = v.length+' characters · saved locally'; }, 350);
}

async function sendChat(e){
  e.preventDefault();
  const input = $('#chatIn'), text = input.value.trim();
  if(!text || state.busy) return;

  state.chat.push({ role:'user', content:text });
  input.value=''; state.busy = true; render();

  const log = $('#log');
  const node = document.createElement('div');
  node.className = 'msg bot';
  node.innerHTML = `<span class="who">${esc(state.model)}</span><span class="typing"><span></span><span></span><span></span></span>`;
  log.appendChild(node); log.scrollTop = log.scrollHeight;

  let acc = '', first = true;
  try{
    await streamChat(state.chat.map(m=>({role:m.role,content:m.content})), d=>{
      if(first){ node.innerHTML = `<span class="who">${esc(state.model)}</span><span id="cur"></span>`; first=false; }
      acc += d; node.querySelector('#cur').textContent = acc;
      log.scrollTop = log.scrollHeight;
    });
    state.chat.push({ role:'assistant', content:acc || '(empty reply)' });
  }catch(err){
    state.chat.push({ role:'err', content:'Could not get a reply — ' + err.message });
  }
  store.set('chat', state.chat.slice(-60));
  state.busy = false; render();
  const l = $('#log'); if(l) l.scrollTop = l.scrollHeight;
}

async function sendRoom(e){
  e.preventDefault();
  const input = $('#roomIn'), text = input.value.trim();
  if(!text || state.busy) return;

  state.room.push({ role:'user', who:'You', content:text });
  input.value=''; state.busy = true; render();
  const log = $('#roomLog');

  // Each agent answers in turn, seeing what came before — same shape as the
  // desktop Mastermind, so the conversation actually builds on itself.
  for(const a of AGENTS){
    const node = document.createElement('div');
    node.className = 'msg bot';
    node.innerHTML = `<span class="who" style="color:${a.color}">${a.name}</span><span class="typing"><span></span><span></span><span></span></span>`;
    log.appendChild(node); log.scrollTop = log.scrollHeight;

    const transcript = state.room.slice(-10)
      .map(m => `${m.who}: ${m.content}`).join('\n');
    let acc = '', first = true;
    try{
      await streamChat([
        { role:'system', content:`${a.persona}\n\n${ROOM_RULES}` },
        { role:'user',   content:`${transcript}\n\nReply as ${a.name}.` }
      ], d=>{
        if(first){ node.innerHTML = `<span class="who" style="color:${a.color}">${a.name}</span><span class="cur"></span>`; first=false; }
        acc += d; node.querySelector('.cur').textContent = acc;
        log.scrollTop = log.scrollHeight;
      });
      state.room.push({ role:'bot', who:a.name, color:a.color, content: acc || '(no reply)' });
    }catch(err){
      state.room.push({ role:'err', who:a.name, color:a.color, content:`couldn't reply — ${err.message}` });
      node.className = 'msg bot err';
      node.innerHTML = `<span class="who" style="color:${a.color}">${a.name}</span>couldn't reply — ${esc(err.message)}`;
    }
  }
  store.set('room', state.room.slice(-60));
  state.busy = false; render();
  const l = $('#roomLog'); if(l) l.scrollTop = l.scrollHeight;
}

/* ── command palette ─────────────────────────────────────────── */
let palSel = 0;
function openPalette(){
  $('#paletteScrim').classList.remove('hide');
  const i = $('#paletteInput'); i.value=''; palSel=0; drawPalette(''); i.focus();
}
function closePalette(){ $('#paletteScrim').classList.add('hide'); }
function paletteItems(q){
  return NAV.filter(n=>n.id && n.label.toLowerCase().includes(q.toLowerCase()));
}
function drawPalette(q){
  const items = paletteItems(q);
  if(palSel >= items.length) palSel = Math.max(0, items.length-1);
  $('#paletteList').innerHTML = items.length
    ? items.map((n,i)=>`<button class="opt ${i===palSel?'sel':''}" onclick="go('${n.id}');closePalette()">
        <span style="color:var(--accent);width:16px">${n.ico}</span>${esc(n.label)}
        ${n.live?'<span class="kbd" style="margin-left:auto">live</span>':''}</button>`).join('')
    : '<div class="empty" style="padding:26px">No match</div>';
}

/* ── render ──────────────────────────────────────────────────── */
function render(){
  $('#nav').innerHTML = NAV.map(n => n.group
    ? `<div class="nav-label">${n.group}</div>`
    : `<button class="nav-item ${state.view===n.id?'active':''}" onclick="go('${n.id}')">
         <span class="ico">${n.ico}</span>${esc(n.label)}
         ${n.live?`<span class="badge">${state.online?'●':'○'}</span>`:''}</button>`
  ).join('');
  $('#main').innerHTML = (views[state.view] || views.mission)();
  const l = $('#log') || $('#roomLog'); if(l) l.scrollTop = l.scrollHeight;
}

window.addEventListener('hashchange', ()=>{ state.view = (location.hash||'#/').slice(2) || 'mission'; render(); });
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if($('#paletteScrim').classList.contains('hide')) return;
  const items = paletteItems($('#paletteInput').value);
  if(e.key==='Escape') closePalette();
  else if(e.key==='ArrowDown'){ e.preventDefault(); palSel=Math.min(palSel+1,items.length-1); drawPalette($('#paletteInput').value); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(palSel-1,0); drawPalette($('#paletteInput').value); }
  else if(e.key==='Enter' && items[palSel]){ go(items[palSel].id); closePalette(); }
});
$('#paletteInput').addEventListener('input', e=>{ palSel=0; drawPalette(e.target.value); });
$('#paletteScrim').addEventListener('click', e=>{ if(e.target.id==='paletteScrim') closePalette(); });

render();
probeGateway();
setInterval(()=>{ if(!state.busy) probeGateway(); }, 60000);
</script>
</body>
